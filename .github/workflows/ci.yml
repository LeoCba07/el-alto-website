name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The build reads published content from Sanity's public CDN, no token.
      # Both values already ship in the site's JavaScript, so they aren't secrets.
      NEXT_PUBLIC_SANITY_PROJECT_ID: tw1o0dkg
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
